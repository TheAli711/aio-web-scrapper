server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location = /server-error { return 500 "internal error\n"; }
  # SSRF probe: a public-looking page that redirects to the cloud metadata endpoint (not linked).
  location = /redirect-to-metadata { return 302 http://169.254.169.254/latest/meta-data/; }
  location / { try_files $uri $uri/ =404; }
}
