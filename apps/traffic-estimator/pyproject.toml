[project]
name = "traffic-estimator"
version = "0.1.0"
description = "Website traffic estimation from free/open signals (Tranco, Common Crawl, own crawl, DNS/RDAP). Estimates, not measurements."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "lxml>=5.2",
  "protego>=0.3",
  "tldextract>=5.1",
  "idna>=3.7",
  "pyyaml>=6.0",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.5",
  "lightgbm>=4.4",
  "numpy>=1.26",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
traffic-estimator = "traffic_estimator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_estimator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# Blocking file access only happens in one-off CLI/startup paths (migrations, dataset import).
ignore = ["ASYNC230", "ASYNC240"]
